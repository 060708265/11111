<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>初中地理·地球的宇宙环境 | 太阳系交互教学</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; background-color: black; color: white; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 12px 24px;
            border-radius: 30px;
            pointer-events: none;
            z-index: 100;
            border-left: 4px solid #ffaa00;
            box-shadow: 0 0 20px rgba(255,170,0,0.3);
        }
        #info h1 {
            margin: 0;
            font-size: 1.4rem;
            color: #ffaa00;
            letter-spacing: 2px;
        }
        #info p {
            margin: 4px 0 0;
            font-size: 0.8rem;
            color: #ccc;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,30,0.85);
            padding: 15px 30px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid #444;
            display: flex;
            gap: 30px;
            align-items: center;
            z-index: 200;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ddd;
            font-size: 0.95rem;
        }
        .control-item label {
            cursor: pointer;
            user-select: none;
            color: #aaa;
        }
        input[type="range"] {
            width: 160px;
            height: 6px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #ffaa00;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 10px #ffaa00;
            cursor: pointer;
        }
        #speedValue {
            min-width: 45px;
            text-align: center;
            color: #ffaa00;
            font-weight: bold;
        }
        #resetViewBtn {
            background: #ffaa00;
            border: none;
            color: black;
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255,170,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
        }
        #resetViewBtn:hover {
            background: #ffc34d;
            transform: scale(1.02);
            box-shadow: 0 0 25px #ffaa00;
        }
        #planet-detail {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10,10,20,0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            width: 260px;
            border: 1px solid #ffaa00;
            box-shadow: 0 0 30px rgba(255,170,0,0.2);
            color: #eee;
            transition: opacity 0.3s;
            z-index: 150;
            pointer-events: none;
            opacity: 0;
        }
        #planet-detail h2 {
            margin: 0 0 10px;
            color: #ffaa00;
            font-size: 1.6rem;
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        #planet-detail p {
            margin: 8px 0;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #ccc;
        }
        #planet-detail .highlight {
            color: #ffaa00;
            font-weight: bold;
        }
        .instruction {
            position: absolute;
            bottom: 100px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>🌌 地球的宇宙环境 · 太阳系</h1>
        <p>拖动行星 | 调节速度 | 点击行星观察</p>
    </div>

    <div id="planet-detail">
        <h2 id="detail-name">地球</h2>
        <p><span class="highlight">类型：</span><span id="detail-type">类地行星</span></p>
        <p><span class="highlight">特点：</span><span id="detail-desc">目前已知唯一存在生命的行星。</span></p>
        <p><span class="highlight">轨道半径：</span><span id="detail-dist">1.0 AU</span></p>
    </div>

    <div id="controls">
        <div class="control-item">
            <label for="speedSlider">公转速度</label>
            <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
            <span id="speedValue">1.0x</span>
        </div>
        <button id="resetViewBtn">🌍 重置视角</button>
    </div>

    <div class="instruction">🪐 提示：拖动行星可调整位置（教学演示），点击行星切换视角</div>

    <!-- 引入 Three.js 核心库和附加组件 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { DragControls } from 'three/addons/controls/DragControls.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        
        // 相机
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 60);
        camera.lookAt(0, 0, 0);

        // WebGL渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false; // 为了性能，不使用阴影
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // CSS2渲染器用于标签
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // 让标签不阻挡鼠标事件
        document.body.appendChild(labelRenderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.0;
        controls.rotateSpeed = 0.8;
        controls.target.set(0, 0, 0);
        controls.maxDistance = 200;
        controls.minDistance = 5;

        // --- 光源 ---
        // 环境光
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        // 太阳点光源
        const sunLight = new THREE.PointLight(0xffeedd, 2, 0, 0);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);
        // 补充光
        const fillLight = new THREE.DirectionalLight(0x445566, 0.5);
        fillLight.position.set(10, 20, 20);
        scene.add(fillLight);

        // --- 星空背景 (粒子系统) ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starsPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starsPositions[i] = (Math.random() - 0.5) * 600;
            starsPositions[i+1] = (Math.random() - 0.5) * 600;
            starsPositions[i+2] = (Math.random() - 0.5) * 600;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.25, transparent: true});
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- 太阳 ---
        const sunGeometry = new THREE.SphereGeometry(3.5, 64, 64);
        const sunMaterial = new THREE.MeshStandardMaterial({
            color: 0xffaa00,
            emissive: 0xff6600,
            roughness: 0.4,
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);
        
        // 太阳光晕效果 (点光源已在上面)
        // 添加一个简单发光粒子效果
        const sunGlowGeometry = new THREE.SphereGeometry(3.7, 32, 32);
        const sunGlowMaterial = new THREE.MeshBasicMaterial({
            color: 0xffaa00,
            transparent: true,
            opacity: 0.2
        });
        const sunGlow = new THREE.Mesh(sunGlowGeometry, sunGlowMaterial);
        scene.add(sunGlow);

        // 太阳标签
        const sunDiv = document.createElement('div');
        sunDiv.textContent = '☀️ 太阳';
        sunDiv.style.color = '#ffaa00';
        sunDiv.style.fontWeight = 'bold';
        sunDiv.style.textShadow = '0 0 10px #ffaa00';
        const sunLabel = new CSS2DObject(sunDiv);
        sunLabel.position.set(0, 5, 0);
        sun.add(sunLabel);

        // --- 行星数据 (尺寸和距离经过调整，便于观察) ---
        // 距离系数: 为了视觉上不太挤，使用自定义距离
        const planetsData = [
            { name: '水星', color: 0xaaaaaa, size: 0.6, distance: 6, speed: 0.04, type: '类地行星', desc: '离太阳最近，昼夜温差极大。', distAU: '0.39 AU' },
            { name: '金星', color: 0xffcc88, size: 0.8, distance: 8.5, speed: 0.025, type: '类地行星', desc: '高温高压，被称为地球的“姐妹星”。', distAU: '0.72 AU' },
            { name: '地球', color: 0x2288ff, size: 0.9, distance: 11, speed: 0.02, type: '类地行星', desc: '目前已知唯一存在生命的行星。', distAU: '1.00 AU' },
            { name: '火星', color: 0xff6633, size: 0.7, distance: 14, speed: 0.015, type: '类地行星', desc: '红色星球，有太阳系最高的火山。', distAU: '1.52 AU' },
            { name: '木星', color: 0xddbb99, size: 1.8, distance: 19, speed: 0.008, type: '气态巨行星', desc: '太阳系最大的行星，有大红斑。', distAU: '5.20 AU' },
            { name: '土星', color: 0xeeddbb, size: 1.5, distance: 25, speed: 0.005, type: '气态巨行星', desc: '拥有美丽的光环。', distAU: '9.54 AU' },
            { name: '天王星', color: 0x88ccff, size: 1.2, distance: 31, speed: 0.003, type: '冰巨星', desc: '自转轴倾斜，像滚动的球。', distAU: '19.2 AU' },
            { name: '海王星', color: 0x3366cc, size: 1.2, distance: 37, speed: 0.002, type: '冰巨星', desc: '风速最快，呈现深蓝色。', distAU: '30.1 AU' }
        ];

        // 存储行星对象以便交互
        const planets = [];
        const orbitLines = [];

        // 辅助函数: 创建圆形轨道线
        function createOrbit(radius, color = 0xffffff, opacity = 0.15) {
            const points = [];
            const segments = 128;
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: color, opacity: opacity, transparent: true });
            const orbit = new THREE.LineLoop(geometry, material);
            scene.add(orbit);
            return orbit;
        }

        // 创建小行星带 (在火星和木星之间)
        function createAsteroidBelt() {
            const beltRadiusInner = 16.5;
            const beltRadiusOuter = 18.5;
            const count = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const r = beltRadiusInner + Math.random() * (beltRadiusOuter - beltRadiusInner);
                const angle = Math.random() * Math.PI * 2;
                const yOffset = (Math.random() - 0.5) * 0.8;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                positions[i*3] = x;
                positions[i*3+1] = yOffset;
                positions[i*3+2] = z;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0xaa9977, size: 0.12 });
            const belt = new THREE.Points(geometry, material);
            scene.add(belt);
        }

        // 创建所有轨道
        planetsData.forEach(p => {
            createOrbit(p.distance, 0x446688, 0.25);
        });
        // 额外增加一个小行星带轨道提示（可选）
        createOrbit(17.5, 0x886644, 0.1);
        createAsteroidBelt();

        // 创建行星
        planetsData.forEach((data, index) => {
            // 行星球体
            const geometry = new THREE.SphereGeometry(data.size, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: data.color,
                roughness: 0.5,
                metalness: 0.1,
                emissive: new THREE.Color(0x111111),
            });
            const planet = new THREE.Mesh(geometry, material);
            
            // 初始位置 (随机角度起始)
            const initAngle = Math.random() * Math.PI * 2;
            planet.position.x = Math.cos(initAngle) * data.distance;
            planet.position.z = Math.sin(initAngle) * data.distance;
            
            // 存储自定义属性以便动画和拖动
            planet.userData = {
                name: data.name,
                distance: data.distance,
                speed: data.speed,
                angle: initAngle,
                type: data.type,
                desc: data.desc,
                distAU: data.distAU,
                color: data.color,
                size: data.size
            };
            
            scene.add(planet);
            
            // 行星标签
            const labelDiv = document.createElement('div');
            labelDiv.textContent = data.name;
            labelDiv.style.color = '#fff';
            labelDiv.style.fontSize = '14px';
            labelDiv.style.fontWeight = 'bold';
            labelDiv.style.textShadow = '0 0 8px black';
            labelDiv.style.background = 'rgba(0,0,0,0.6)';
            labelDiv.style.padding = '2px 8px';
            labelDiv.style.borderRadius = '12px';
            labelDiv.style.border = '1px solid ' + new THREE.Color(data.color).getStyle();
            labelDiv.style.pointerEvents = 'none';
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, data.size + 0.8, 0);
            planet.add(label);
            
            planets.push(planet);
        });

        // 为土星添加光环
        const saturn = planets.find(p => p.userData.name === '土星');
        if (saturn) {
            const ringGeometry = new THREE.TorusGeometry(2.0, 0.25, 16, 100);
            const ringMaterial = new THREE.MeshStandardMaterial({
                color: 0xccbb99,
                emissive: 0x221100,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.7
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2;
            ring.rotation.z = 0.3; // 稍微倾斜
            saturn.add(ring);
            
            // 第二个细环
            const ring2Geometry = new THREE.TorusGeometry(2.3, 0.1, 16, 100);
            const ring2Material = new THREE.MeshStandardMaterial({
                color: 0xaa9977,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.5
            });
            const ring2 = new THREE.Mesh(ring2Geometry, ring2Material);
            ring2.rotation.x = Math.PI / 2;
            ring2.rotation.z = 0.3;
            saturn.add(ring2);
        }

        // 添加地球的月球 (小点缀)
        const earth = planets.find(p => p.userData.name === '地球');
        if (earth) {
            const moonGeometry = new THREE.SphereGeometry(0.25, 16, 16);
            const moonMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc });
            const moon = new THREE.Mesh(moonGeometry, moonMaterial);
            moon.position.set(1.5, 0.2, 0);
            earth.add(moon);
        }

        // --- 交互: 拖动行星 (使用 DragControls) ---
        const dragObjects = [...planets]; // 可拖动的行星
        const dragControls = new DragControls(dragObjects, camera, renderer.domElement);
        
        // 拖动时禁用OrbitControls防止冲突
        dragControls.addEventListener('dragstart', function (event) {
            controls.enabled = false;
            // 高亮拖动的行星
            event.object.material.emissive.setHex(0x444400);
        });

        dragControls.addEventListener('drag', function (event) {
            // 拖动过程中，限制行星只在水平面移动？但为了教学自由，可以任意移动，但为了保持轨道概念，可以限制Y轴
            // 这里为了保持视觉，限制Y轴接近0，但可以轻微移动？为了明显，限制在水平面附近
            event.object.position.y = 0; 
            
            // 更新行星的userData角度，以便释放后继续公转？但为了简单，释放后根据新位置计算角度
            // 这里不立即更新角度，在dragend时处理
        });

        dragControls.addEventListener('dragend', function (event) {
            controls.enabled = true;
            event.object.material.emissive.setHex(0x111111);
            
            // 拖动结束后，将行星的位置转换为公转角度和距离(强制为预设距离，保持轨道秩序，或允许自由距离?)
            // 为了教学“正确认识八大行星”，我们重置距离为预设值，但角度根据新位置计算
            const planet = event.object;
            const data = planet.userData;
            
            // 计算当前角度
            const dx = planet.position.x;
            const dz = planet.position.z;
            let angle = Math.atan2(dz, dx);
            if (angle < 0) angle += Math.PI * 2;
            
            // 强制距离为预设距离（让行星回到正确轨道）
            planet.position.x = Math.cos(angle) * data.distance;
            planet.position.z = Math.sin(angle) * data.distance;
            planet.position.y = 0;
            
            // 更新角度存储
            data.angle = angle;
        });

        // --- 点击行星切换视角并显示详情 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        // 用于详情显示的DOM
        const detailDiv = document.getElementById('planet-detail');
        const detailName = document.getElementById('detail-name');
        const detailType = document.getElementById('detail-type');
        const detailDesc = document.getElementById('detail-desc');
        const detailDist = document.getElementById('detail-dist');

        // 重置视角按钮
        document.getElementById('resetViewBtn').addEventListener('click', () => {
            // 平滑重置相机
            camera.position.set(0, 25, 60);
            controls.target.set(0, 0, 0);
            controls.update();
            // 隐藏详情
            detailDiv.style.opacity = '0';
        });

        // 点击事件
        renderer.domElement.addEventListener('click', (event) => {
            // 计算鼠标位置归一化坐标
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // 检测与所有行星的交点
            const intersects = raycaster.intersectObjects(planets);
            
            if (intersects.length > 0) {
                // 取第一个交点
                const hit = intersects[0].object;
                const data = hit.userData;
                
                // 显示详情
                detailName.textContent = data.name;
                detailType.textContent = data.type;
                detailDesc.textContent = data.desc;
                detailDist.textContent = data.distAU;
                detailDiv.style.opacity = '1';
                
                // 切换视角: 相机看向该行星，并调整位置
                // 使用tween动画? 为了简单，直接设置位置，但使用controls的target
                const planetPos = hit.position.clone();
                
                // 计算相机位置: 在行星外侧上方
                const offset = new THREE.Vector3(0, data.size * 3 + 3, data.size * 4 + 5);
                // 根据行星与太阳方向调整角度，使视角更好
                const dirFromSun = planetPos.clone().normalize();
                // 让相机从侧面看
                const sideDir = new THREE.Vector3(-dirFromSun.z, 0.6, dirFromSun.x).normalize();
                const camPos = planetPos.clone().add(sideDir.multiplyScalar(data.size * 6 + 6));
                camPos.y = data.size * 3 + 4; // 保持一定高度
                
                // 使用动画过渡? 直接设置
                camera.position.copy(camPos);
                controls.target.copy(planetPos);
                controls.update();
            } else {
                // 点击空白区域可以隐藏详情，但不重置视角
                // detailDiv.style.opacity = '0';
            }
        });

        // --- 速度控制 ---
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        let speedFactor = 1.0;
        
        speedSlider.addEventListener('input', (e) => {
            speedFactor = parseFloat(e.target.value);
            speedValue.textContent = speedFactor.toFixed(1) + 'x';
        });

        // --- 动画循环 ---
        let clock = new THREE.Clock();
        
        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() / 1000; // seconds
            
            // 更新行星公转位置
            planets.forEach(planet => {
                const data = planet.userData;
                // 根据速度和速度因子更新角度
                // 注意: 拖动后我们会强制重置距离，但角度可能被用户改变，这里继续累加
                // 但为了不让拖动后立即被公转覆盖，我们仅在非拖动状态更新？但我们无法轻易检测拖动状态
                // 可以判断controls.enabled，但拖动时controls被禁用。或者简单允许公转叠加。
